name: project_pop
description: "Project POP: a one-thumb chain-reaction puzzle game."
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.13.5

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_soloud: ^5.2.1
  pop_core:
    path: ../packages/pop_core
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/music/
  shaders:
    - shaders/ball.frag
  fonts:
    # Nunito, SIL Open Font License 1.1 (assets/fonts/Nunito-OFL.txt).
    # Variable font: weights are set with FontVariation('wght', …), see ui/type.dart.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

# App icons: render with `flutter test tool/render_icon_test.dart`, then
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#6FB8FF"
    theme_color: "#6FB8FF"

# Launch screen in the game's sky colour: `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#6FB8FF"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#6FB8FF"
    image: assets/icon/icon_foreground.png
