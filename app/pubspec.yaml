name: project_pop
description: "Project POP: a one-thumb chain-reaction puzzle game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  pop_core:
    path: ../packages/pop_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Sora, SIL Open Font License 1.1 (assets/fonts/Sora-OFL.txt).
    # Variable font: weights are set with FontVariation('wght', …), see ui/type.dart.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
